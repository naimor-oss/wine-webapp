<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<!--
  The stock noVNC client (vnc.html: connected, reconnecting on its own), plus
  a window list: the Wine virtual desktop has no taskbar, so a window that
  ends up behind a maximized one is otherwise unreachable. The list comes from
  the gateway's /api/windows, fetched only while the panel is open. See
  docs/frontends.md, "Window list".

  The screen follows the window (WEBAPP_RESIZE=remote): noVNC asks Xvnc for a
  screen the size of the window, and this page then asks the gateway to fit
  the Wine desktop to it. Or it is fixed and scaled (scale). See
  docs/frontends.md, "Screen size".

  The manifest lets a browser install the page as an app with its own window.
  See docs/frontends.md, "Installed as an app".
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #333; }
  /* remote: below the minimum screen size the page scrolls instead */
  body.remote { overflow: auto; }
  #vnc { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* Top centre, over the app's title bar: the top right corner holds a
     maximized window's minimize, maximize and close buttons. */
  #bar {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 2;
    display: flex; gap: 1px;
  }
  #bar button {
    font: 12px system-ui, sans-serif; color: #fff; background: rgba(40, 40, 40, .75);
    border: 1px solid rgba(255, 255, 255, .35); border-top: 0; border-radius: 0 0 4px 4px;
    padding: 2px 10px; cursor: pointer; opacity: .6;
  }
  #bar button:hover, #bar button[aria-expanded="true"] { opacity: 1; }
  .panel {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 2;
    min-width: 260px; max-width: 60vw;
    max-height: 70vh; overflow: auto; font: 13px system-ui, sans-serif; color: #111;
    background: #fff; border: 1px solid #888; border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
  }
  .panel[hidden] { display: none; }
  .panel ul { list-style: none; margin: 0; padding: 4px 0; }
  .panel button, .panel a {
    display: block; width: 100%; box-sizing: border-box; text-align: left; font: inherit; color: inherit;
    background: none; border: 0; padding: 6px 12px; cursor: pointer; text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .panel button:hover, .panel button:focus, .panel a:hover, .panel a:focus { background: #dbe8ff; outline: none; }
  .panel .owned { padding-left: 28px; }
  .panel .waiting { color: #777; }
  .panel .when { float: right; margin-left: 16px; color: #777; }
  .panel .note { padding: 8px 12px; color: #555; }
  /* A new print: bottom centre, until opened, dismissed or 20 s are up. */
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 3;
    display: flex; gap: 12px; align-items: center; max-width: 80vw;
    font: 13px system-ui, sans-serif; color: #fff; background: rgba(30, 30, 30, .92);
    border-radius: 6px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
  }
  #toast[hidden] { display: none; }
  #notice { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 3;
            max-width: min(90vw, 560px); padding: 10px 16px; border-radius: 6px;
            background: #8a5a00; color: #fff; font: 15px system-ui, sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #notice[hidden] { display: none; }
  #cover { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center;
           background: var(--cover-bg, rgba(32, 32, 32, .82)); color: #fff;
           font: 18px system-ui, sans-serif; text-align: center; }
  #cover[hidden] { display: none; }
  #cover button { margin-top: 12px; font: inherit; padding: 8px 20px; border-radius: 6px;
                  border: 0; background: #2f6fd0; color: #fff; cursor: pointer; }
  #toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast a { color: #9cc3ff; font-weight: 600; }
  #toast button { font: inherit; color: #ccc; background: none; border: 0; cursor: pointer; }
</style>
<iframe id="vnc" title="Application"></iframe>
<div id="bar">
  <button id="win-button" type="button" aria-expanded="false" aria-controls="win-panel">Windows</button>
  <button id="prints-button" type="button" aria-expanded="false" aria-controls="prints-panel">Prints</button>
</div>
<div id="win-panel" class="panel" hidden></div>
<div id="prints-panel" class="panel" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="notice" role="alert" hidden></div>
<div id="cover" hidden><div><p id="cover-text"></p><button id="cover-button" type="button" hidden>Open again</button></div></div>
<script>
"use strict";
const frame = document.getElementById("vnc");
const button = document.getElementById("win-button");
const panel = document.getElementById("win-panel");

// Keyboard input reaches the app only while noVNC's canvas has focus; using
// the panel takes focus away, so hand it back whenever the panel closes.
function focusApp() {
  frame.focus();
  const canvas = frame.contentDocument && frame.contentDocument.querySelector("#noVNC_container canvas");
  if (canvas) canvas.focus();
}

function hidePanel() {
  panel.hidden = true;
  button.setAttribute("aria-expanded", "false");
}

function closePanel() {
  hidePanel();
  focusApp();
}

function note(text) {
  panel.replaceChildren(Object.assign(document.createElement("div"), { className: "note", textContent: text }));
}

// A disabled window is waiting for a dialog: raising it alone shows nothing
// useful, so raise the dialog it owns instead, when there is one in the list.
function target(w, all) {
  if (w.enabled) return w.hwnd;
  const dialog = all.find(d => d.owner === w.hwnd && d.enabled);
  return dialog ? dialog.hwnd : w.hwnd;
}

async function raise(hwnd) {
  try {
    const r = await fetch("api/windows/" + hwnd + "/raise", { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    closePanel();
  } catch (e) {
    note("Could not bring the window forward: " + e.message);
  }
}

async function openPanel() {
  panel.hidden = false;
  button.setAttribute("aria-expanded", "true");
  note("Loading…");
  let windows;
  try {
    const r = await fetch("api/windows", { cache: "no-store" });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.statusText);
    windows = body.windows;
  } catch (e) {
    note("Window list unavailable: " + e.message);
    return;
  }
  if (!windows.length) { note("No windows open."); return; }
  const list = document.createElement("ul");
  for (const w of windows) {
    const item = document.createElement("button");
    item.type = "button";
    item.textContent = w.title + (w.minimized ? " (minimized)" : "") + (w.enabled ? "" : " (waiting for a dialog)");
    item.title = w.title;
    if (w.owner) item.classList.add("owned");
    if (!w.enabled) item.classList.add("waiting");
    item.addEventListener("click", () => raise(target(w, windows)));
    const li = document.createElement("li");
    li.append(item);
    list.append(li);
  }
  panel.replaceChildren(list);
  list.querySelector("button").focus();
}

// Prints: the app prints to a PDF printer; each PDF opens in a new browser
// tab, to view, save or print on the user's own printer. See
// docs/frontends.md, "Printing".
const printsButton = document.getElementById("prints-button");
const printsPanel = document.getElementById("prints-panel");
const toast = document.getElementById("toast");
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function hidePrints() {
  printsPanel.hidden = true;
  printsButton.setAttribute("aria-expanded", "false");
}

function printLink(p, after) {
  const a = Object.assign(document.createElement("a"), { href: p.url, target: "_blank", rel: "noopener" });
  a.append(Object.assign(document.createElement("span"), { className: "when", textContent: clock(p.time) }), p.title);
  a.title = p.title;
  a.addEventListener("click", () => setTimeout(after, 0));
  return a;
}

async function openPrints() {
  printsPanel.hidden = false;
  printsButton.setAttribute("aria-expanded", "true");
  let list;
  try {
    list = (await (await fetch("api/prints", { cache: "no-store" })).json()).prints;
  } catch (e) {
    printsPanel.replaceChildren(Object.assign(document.createElement("div"), { className: "note", textContent: "Prints unavailable: " + e.message }));
    return;
  }
  if (!list.length) {
    printsPanel.replaceChildren(Object.assign(document.createElement("div"), { className: "note", textContent: "Nothing printed in the last day. Print from the app to the PDF printer." }));
    return;
  }
  const ul = document.createElement("ul");
  for (const p of list) {
    const li = document.createElement("li");
    li.append(printLink(p, () => { hidePrints(); focusApp(); }));
    ul.append(li);
  }
  printsPanel.replaceChildren(ul);
  ul.querySelector("a").focus();
}

let toastTimer;
function hideToast() { toast.hidden = true; clearTimeout(toastTimer); }
function showToast(p) {
  const link = printLink(p, () => { hideToast(); focusApp(); });
  link.textContent = "Open";
  const close = Object.assign(document.createElement("button"), { type: "button", textContent: "✕", title: "Dismiss" });
  close.addEventListener("click", () => { hideToast(); focusApp(); });
  toast.replaceChildren(Object.assign(document.createElement("span"), { textContent: "Printed: " + p.title }), link, close);
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 20000);
}

// Notice new prints: a cheap directory listing every 3 s while the page is
// visible. Prints already there when the page loads are not announced.
const seen = new Set();
let primed = false;
async function checkPrints() {
  if (document.hidden) return;
  try {
    const list = (await (await fetch("api/prints", { cache: "no-store" })).json()).prints;
    const fresh = list.filter(p => !seen.has(p.name));
    list.forEach(p => seen.add(p.name));
    if (primed && fresh.length) showToast(fresh[0]);
    primed = true;
  } catch (e) {
    // gateway restarting; try again next time
  }
}
setInterval(checkPrints, 3000);
checkPrints();

// Notices from the session broker (docs/broker.md), e.g. "this session will
// close at 14:30 unless you use it". Shown on the page, and as a system
// notification when the window isn't in front. Checked even while the page
// is hidden, since that's when a notification matters.
const noticeBox = document.getElementById("notice");
let lastNotice = "";
async function checkNotice() {
  try {
    const r = await fetch("api/notice", { cache: "no-store" });
    // 410: the session broker ended this session; say why and offer to reopen.
    if (r.status === 410) {
      const why = (await r.json().catch(() => ({}))).reason || "closed";
      closed(why);
      return;
    }
    const n = await r.json();
    const text = n.message || "";
    noticeBox.textContent = text;
    noticeBox.hidden = !text;
    if (text && text !== lastNotice && "Notification" in window
        && Notification.permission === "granted" && (document.hidden || !document.hasFocus())) {
      new Notification(document.title, { body: text, tag: "wine-webapp-notice", requireInteraction: true });
    }
    lastNotice = text;
  } catch (e) {
    // gateway restarting; try again next time
  }
}
setInterval(checkNotice, 15000);
checkNotice();

// The cover: while the session broker's login watcher signs the user in to
// the app (after a restart, for instance), or after the session ended.
// While it shows, the app can't be clicked or typed into.
const cover = document.getElementById("cover");
const coverText = document.getElementById("cover-text");
const coverButton = document.getElementById("cover-button");
coverButton.addEventListener("click", () => location.reload());
let ended = false;
function showCover(text, reopen) {
  coverText.textContent = text;
  coverButton.hidden = !reopen;
  cover.hidden = false;
  frame.inert = true;
}
function hideCover() {
  cover.hidden = true;
  frame.inert = false;
}
function closed(why) {
  ended = true;
  const name = document.title || "The app";
  const text = { closed: `${name} was closed.`, idle: "This session was closed after a time without activity.",
                 maintenance: "This session was closed for maintenance." }[why] || "This session was closed.";
  showCover(text, true);
}
async function checkLogin() {
  if (ended) return;
  try {
    const r = await fetch("api/login", { cache: "no-store" });
    if (r.status === 410) { closed((await r.json().catch(() => ({}))).reason); return; }
    const state = (await r.json()).state;
    if (state === "waiting" || state === "filling" || state === "mismatch") showCover("Signing in…", false);
    else if (state === "failed") showCover("Could not sign you in. Try again in a minute.", true);
    else hideCover();
  } catch (e) {
    // gateway restarting; try again next time
  }
}
setInterval(checkLogin, 1500);
checkLogin();
// Ask once, on the first click on the page's own controls (a user gesture).
document.getElementById("bar").addEventListener("click", () => {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}, { once: true });

button.addEventListener("click", () => { hidePrints(); panel.hidden ? openPanel() : closePanel(); });
printsButton.addEventListener("click", () => { hidePanel(); printsPanel.hidden ? openPrints() : (hidePrints(), focusApp()); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!panel.hidden) closePanel();
  if (!printsPanel.hidden) { hidePrints(); focusApp(); }
});
// A click into the app (inside the iframe) moves focus out of this page.
window.addEventListener("blur", () => { if (!panel.hidden) hidePanel(); if (!printsPanel.hidden) hidePrints(); });

const wxh = s => (s || "").split("x").map(Number);

// remote: once noVNC has asked Xvnc for a screen the size of the frame (on
// connecting, and after the window has been resized), fit the Wine desktop to
// it. The gateway retries until Xvnc has caught up.
function followWindow(info) {
  const [minW, minH] = wxh(info.min), [maxW, maxH] = wxh(info.max);
  document.body.classList.add("remote");
  Object.assign(frame.style, {
    minWidth: minW + "px", minHeight: minH + "px", maxWidth: maxW + "px", maxHeight: maxH + "px",
  });
  let sent = "", timer;
  const fit = async force => {
    const size = { width: frame.clientWidth, height: frame.clientHeight };
    const key = size.width + "x" + size.height;
    if (key === sent && !force) return;
    sent = key;
    try {
      await fetch("api/screen", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(size),
      });
    } catch (e) {
      sent = "";
    }
  };
  // noVNC waits half a second after the last resize event before asking Xvnc.
  addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(fit, 800); });
  // A (re)connect resizes Xvnc too, and after a container restart Wine has
  // started at the old size.
  frame.addEventListener("load", () => {
    const root = frame.contentDocument.documentElement;
    let connected = false;
    new MutationObserver(() => {
      const now = root.classList.contains("noVNC_connected");
      if (now && !connected) setTimeout(() => fit(true), 800);
      connected = now;
    }).observe(root, { attributes: true, attributeFilter: ["class"] });
  });
}

// scale: in the installed app's window, take the screen's size at one browser
// pixel per screen pixel, so noVNC has nothing to scale. Resizing it later
// scales again; so does a window that doesn't fit on the user's monitor.
function fitWindowToScreen(info) {
  const [w, h] = wxh(info.screen);
  if (!w || !h || !matchMedia("(display-mode: standalone)").matches) return;
  const width = w + outerWidth - innerWidth, height = h + outerHeight - innerHeight;
  if (width > screen.availWidth || height > screen.availHeight) return;
  resizeTo(width, height);
  moveTo(screen.availLeft + (screen.availWidth - width) / 2, screen.availTop + (screen.availHeight - height) / 2);
}

(async () => {
  let info = { resize: "scale" };
  try {
    info = await (await fetch("api/info", { cache: "no-store" })).json();
    document.title = info.name;
  } catch (e) {
    // Without the gateway's API, connect scaled.
  }
  const remote = info.resize === "remote";
  if (remote) followWindow(info);
  frame.src = "vnc.html?autoconnect=1&resize=" + (remote ? "remote" : "scale") +
    "&reconnect=1&reconnect_delay=1000&show_dot=1";
  if (!remote) fitWindowToScreen(info);
})();
</script>
