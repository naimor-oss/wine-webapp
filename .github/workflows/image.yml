# Builds the base and vnc images, smoke-tests the notepad example on them,
# and publishes to ghcr.io/naimor-oss/wine-webapp (docs/releases.md).
#   pull request  build + smoke test, nothing pushed
#   main          also push :base, :vnc (moving) and :vnc-<date>-<sha>, :base-<date>-<sha>
#   tag vX.Y.Z    also push :vnc-X.Y.Z, :base-X.Y.Z (the tags to build app images on)
#   schedule      weekly rebuild of main, to pick up Debian security updates
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/naimor-oss/wine-webapp

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: v
        run: |
          sha=$(git rev-parse --short=12 HEAD)
          echo "stamp=$(date -u +%Y%m%d)-$sha" >>"$GITHUB_OUTPUT"
          case $GITHUB_REF in
            refs/tags/v*) version=${GITHUB_REF#refs/tags/v} ;;
            *) version=0.0.0-$sha ;;
          esac
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          push=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then push=true; fi
          echo "push=$push" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build base and vnc
        run: |
          for target in base vnc; do
            docker buildx build --load --target "$target" \
              --build-arg VERSION=${{ steps.v.outputs.version }} \
              --build-arg REVISION=$GITHUB_SHA \
              --cache-from type=gha --cache-to type=gha,mode=max \
              -t "wine-webapp:$target" .
          done

      - name: Smoke test
        run: |
          docker build -t wine-webapp-example-notepad examples/notepad
          tests/smoke.sh wine-webapp-example-notepad Notepad

      - name: Log in to GHCR
        if: steps.v.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: steps.v.outputs.push == 'true'
        run: |
          for target in base vnc; do
            tags="$target-${{ steps.v.outputs.stamp }}"
            case $GITHUB_REF in
              refs/tags/v*) tags="$tags $target-${{ steps.v.outputs.version }}" ;;
              refs/heads/main) tags="$tags $target" ;;
            esac
            for t in $tags; do
              docker tag "wine-webapp:$target" "$IMAGE:$t"
              docker push "$IMAGE:$t"
            done
          done
