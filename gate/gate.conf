# The sign-in gate in front of wine-webapp-broker (docs/broker.md).
# ${GATE_*} come from the environment; wine-webapp-gate sets the defaults.

ErrorLog /dev/stderr
LogLevel ${GATE_LOG_LEVEL}
LogFormat "%h %u %t \"%r\" %>s %b" gate
CustomLog /dev/stdout gate
ServerName ${GATE_SERVER_NAME}
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:443>
    ServerName ${GATE_SERVER_NAME}
    SSLEngine on
    SSLCertificateFile /etc/wine-webapp-gate/tls.crt
    SSLCertificateKeyFile /etc/wine-webapp-gate/tls.key
    # HTTP/1.1 only: the screen's WebSocket goes through an HTTP/1.1 Upgrade.
    Protocols http/1.1

    <Location />
        # Kerberos (SPNEGO) when the browser has a ticket and offers it;
        # otherwise the browser's own prompt, the password checked against
        # the KDC with the same keytab. Basic is only ever sent over TLS.
        AuthType GSSAPI
        AuthName "${GATE_AUTH_NAME}"
        GssapiCredStore keytab:/run/wine-webapp-gate/http.keytab
        GssapiAllowedMech krb5
        GssapiBasicAuth On
        GssapiBasicAuthMech krb5
        GssapiSSLonly On
        # A signed-in browser keeps a session cookie, so the screen's
        # WebSocket and every later request don't negotiate again.
        GssapiUseSessions On
        GssapiSessionKey file:/run/wine-webapp-gate/session.key
        Session On
        SessionMaxAge ${GATE_SESSION_SECONDS}
        SessionCookieName wine-webapp-gate path=/;secure;httponly;samesite=lax
        Require valid-user
    </Location>

    # The broker trusts this header from the gate only: drop whatever the
    # browser sent, then set it to the authenticated Kerberos principal
    # (user@REALM; the broker compares names case-insensitively).
    RequestHeader unset ${GATE_IDENTITY_HEADER} early
    RequestHeader set ${GATE_IDENTITY_HEADER} "expr=%{REMOTE_USER}"

    ProxyPreserveHost On
    ProxyPass / ${GATE_BACKEND}/ upgrade=websocket timeout=${GATE_PROXY_TIMEOUT}
    ProxyPassReverse / ${GATE_BACKEND}/
</VirtualHost>
