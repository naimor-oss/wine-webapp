<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Text the way Windows draws it by default: ClearType (subpixel smoothing) at
  every size. Wine takes each font's smoothing from fontconfig, ahead of the
  Windows settings in the registry, and Debian's default is grayscale. Wine
  applies a font's "no smoothing at small sizes" table (gasp) to grayscale
  but not to subpixel smoothing, so with grayscale the 8-10pt text of a
  business app is drawn unsmoothed. See docs/app-contract.md, "Text".
-->
<fontconfig>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
</fontconfig>
